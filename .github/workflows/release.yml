name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/monitorzinho dist/monitorzinho-linux-x86_64
          chmod +x dist/monitorzinho-linux-x86_64
          (cd dist && sha256sum monitorzinho-linux-x86_64 > monitorzinho-linux-x86_64.sha256)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/monitorzinho-linux-x86_64
            dist/monitorzinho-linux-x86_64.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
