name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cargo-zigbuild lets us dynamically link against an old glibc baseline
      # (2.17, ~RHEL7-era) instead of whatever glibc happens to ship on the
      # runner. A musl *static* build was tried first, but nvml-wrapper loads
      # libnvidia-ml.so at runtime via dlopen(), and a fully static musl
      # binary cannot dlopen a glibc shared library (it fails silently, no
      # panic, no GPU panel — see git history). Staying dynamically linked
      # against glibc keeps dlopen working normally while the old baseline
      # keeps the binary portable across distros.
      - name: Install zig and cargo-zigbuild
        run: |
          pip install --user ziglang
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked

      - name: Build release binary
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.17

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/monitorzinho dist/monitorzinho-linux-x86_64
          chmod +x dist/monitorzinho-linux-x86_64
          (cd dist && sha256sum monitorzinho-linux-x86_64 > monitorzinho-linux-x86_64.sha256)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/monitorzinho-linux-x86_64
            dist/monitorzinho-linux-x86_64.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
