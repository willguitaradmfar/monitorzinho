[package]
name = "monitorzinho"
version = "0.57.1"
edition = "2024"
description = "A lightweight terminal system monitor: CPU, memory, disk, network, and GPU"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
# O único cliente de banco que entra como crate — os do Postgres e do Mongo são escritos à
# mão em `tools/sherlock`. `minimal-rust` em vez de `minimal` para não puxar a libz do
# sistema, que quebraria o build musl; e o TLS é o mesmo rustls + ring do resto do programa.
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
nvml-wrapper = "0.12.1"
ratatui = "0.30.2"
regex = "1.13.1"
# Already here through rustls; named directly for the one thing rustls does not
# expose — a SHA-256 of a certificate, which is the fingerprint everyone compares.
ring = "0.17.14"
# Tudo que o programa guarda mora num arquivo SQLite só — ver `src/db.rs`. `bundled`
# compila o SQLite junto em vez de procurar um do sistema: o binário publicado tem que
# rodar numa máquina que não tem libsqlite3, e um monitor que não abre porque falta uma
# biblioteca não é um monitor.
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: um comando do MongoDB é identificado pela **primeira** chave do
# documento, e as colunas de uma resposta HTTP saem na ordem em que a API as escreveu.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sysinfo = "0.39.6"
webpki-roots = "1.0.9"
