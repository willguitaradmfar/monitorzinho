[package]
name = "monitorzinho"
version = "0.2.0"
edition = "2024"
description = "A lightweight terminal system monitor: CPU, memory, disk, network, and GPU"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
nvml-wrapper = "0.12.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
