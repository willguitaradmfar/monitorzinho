[package]
name = "monitorzinho"
version = "0.7.0"
edition = "2024"
description = "A lightweight terminal system monitor: CPU, memory, disk, network, and GPU"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
nvml-wrapper = "0.12.1"
ratatui = "0.30.2"
regex = "1.13.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
webpki-roots = "1.0.9"
